[package]
name = "utk-driver"
description = "SteamVR driver exposing VIVE Ultimate Trackers as generic trackers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "driver_utk"
crate-type = ["cdylib"]

[dependencies]
nix = { version = "0.31", features = ["time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cc = "1"
